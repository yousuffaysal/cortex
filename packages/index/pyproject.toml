[project]
name = "cortex-index"
version = "0.1.0"
description = "Incremental file index with hybrid retrieval: ripgrep exact, FTS5 full-text, sqlite-vec semantic."
# 3.12 is pinned, not merely permitted: the locally installed CPython 3.13 was built
# without `enable_load_extension`, which makes sqlite-vec impossible to load. uv's
# CPython 3.12.12 has it. PRD §5.4 specifies 3.12 anyway.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlite-vec>=0.1.9",
    "watchdog>=5.0",
    "pathspec>=0.12",
    "cortex-policy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_index"]

[tool.uv.sources]
cortex-policy = { path = "../policy", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
