[project]
name = "cortex-python-server"
version = "0.1.0"
description = "MCP server: sandboxed Python execution in an ephemeral, network-isolated container."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.9",
    "cortex-policy",
]

[project.scripts]
cortex-python-server = "cortex_python_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_python_server"]

[tool.uv.sources]
cortex-policy = { path = "../../packages/policy", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "anyio>=4.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
